<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, Lakshmi Ma'am</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#1a0b2e;--bg2:#3b1240;--gold:#e8c987;--gold2:#b8893a;--rose:#f4b6c2;--ink:#fff6ea;--card:rgba(255,246,234,.07);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;overflow-x:hidden;
  background:radial-gradient(ellipse at 20% 0%,var(--bg2) 0%,transparent 55%),radial-gradient(ellipse at 90% 100%,#5a1d4a 0%,transparent 50%),var(--bg1)}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.float{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.balloon{position:absolute;bottom:-160px;width:54px;height:68px;border-radius:50% 50% 48% 48%;opacity:.85;
  animation:rise linear infinite;box-shadow:inset -8px -10px 18px rgba(0,0,0,.25),inset 6px 8px 14px rgba(255,255,255,.35)}
.balloon:after{content:"";position:absolute;left:50%;top:100%;width:1px;height:70px;background:rgba(232,201,135,.6)}
.balloon:before{content:"";position:absolute;left:50%;top:97%;width:8px;height:8px;background:inherit;transform:translateX(-50%) rotate(45deg)}
@keyframes rise{0%{transform:translate(0,0) rotate(-4deg)}50%{transform:translate(28px,-60vh) rotate(5deg)}100%{transform:translate(-10px,-125vh) rotate(-3deg)}}
.spark{position:absolute;width:6px;height:6px;background:var(--gold);border-radius:50%;box-shadow:0 0 10px 3px rgba(232,201,135,.7);animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.1;transform:scale(.5)}50%{opacity:1;transform:scale(1.3)}}
main{position:relative;z-index:2;max-width:820px;margin:0 auto;padding:56px 22px 70px;text-align:center}
.crest{width:92px;height:92px;margin:0 auto 6px;display:block;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hb{font-size:clamp(1.2rem,3.5vw,1.6rem);letter-spacing:.42em;color:var(--gold);margin:8px 0 0;font-weight:400}
h1{font-family:'Great Vibes',cursive;font-weight:400;font-size:clamp(4.2rem,17vw,9rem);line-height:1;margin:6px 0 0;
  background:linear-gradient(100deg,#b8893a 0%,#fff3c9 30%,#e8c987 50%,#fff3c9 70%,#b8893a 100%);background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite;filter:drop-shadow(0 4px 24px rgba(232,201,135,.3))}
@keyframes shine{to{background-position:-220% 0}}
.sub{font-style:italic;font-size:clamp(1.15rem,3vw,1.5rem);color:var(--rose);margin:4px 0 30px}
.rule{display:flex;align-items:center;gap:14px;justify-content:center;color:var(--gold);margin:0 auto 34px;max-width:340px}
.rule:before,.rule:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.rule:after{transform:scaleX(-1)}
.cake{position:relative;width:200px;height:190px;margin:0 auto 10px;cursor:pointer;background:none;border:0;padding:0;color:inherit}
.cake:focus-visible,.btn:focus-visible{outline:2px solid var(--gold);outline-offset:6px;border-radius:12px}
.tier{position:absolute;left:50%;transform:translateX(-50%);border-radius:10px 10px 6px 6px}
.t1{bottom:0;width:200px;height:62px;background:linear-gradient(#f4b6c2,#d98aa0)}
.t2{bottom:62px;width:148px;height:52px;background:linear-gradient(#fff3e0,#ecd3ad)}
.t3{bottom:114px;width:96px;height:42px;background:linear-gradient(#f4b6c2,#d98aa0)}
.tier:before{content:"";position:absolute;left:0;right:0;top:0;height:14px;border-radius:10px 10px 50% 50%/10px 10px 14px 14px;background:#fffaf0}
.t2:after{content:"";position:absolute;left:8px;right:8px;bottom:10px;height:3px;background:repeating-linear-gradient(90deg,var(--gold2) 0 8px,transparent 8px 16px);opacity:.8}
.candle{position:absolute;bottom:156px;width:6px;height:26px;background:linear-gradient(#fff,var(--gold));border-radius:2px}
.flame{position:absolute;left:50%;bottom:100%;width:12px;height:20px;transform:translateX(-50%);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  background:radial-gradient(circle at 50% 70%,#fff8d0,#ffb347 60%,rgba(255,120,0,0));box-shadow:0 0 18px 8px rgba(255,190,90,.55);animation:fl .35s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes fl{from{transform:translateX(-50%) scale(1,1) rotate(-3deg)}to{transform:translateX(-50%) scale(.92,1.12) rotate(3deg)}}
.out .flame{opacity:0;transition:opacity .4s;animation:none}
.hint{font-size:1rem;color:rgba(255,246,234,.65);font-style:italic;margin:0 0 34px;min-height:1.4em}
.card{position:relative;padding:44px 30px 40px;border-radius:4px;background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(232,201,135,.55);box-shadow:0 30px 80px rgba(0,0,0,.4),inset 0 0 0 6px rgba(26,11,46,.6),inset 0 0 0 7px rgba(232,201,135,.25)}
.card p{font-size:clamp(1.3rem,3.6vw,1.75rem);line-height:1.6;margin:0 auto;max-width:34ch;font-weight:500}
.card .lead{font-family:'Great Vibes',cursive;font-size:clamp(2.2rem,7vw,3rem);color:var(--gold);max-width:none;margin-bottom:14px;font-weight:400}
.card .em{margin-top:20px;font-size:2rem}
.btn{margin-top:34px;font-family:inherit;font-size:1.2rem;letter-spacing:.08em;color:#2a0f33;background:linear-gradient(120deg,#b8893a,#f6e2a8,#b8893a);border:0;padding:14px 34px;border-radius:40px;cursor:pointer;
  box-shadow:0 10px 30px rgba(184,137,58,.4);transition:transform .2s}
.btn:hover{transform:translateY(-2px) scale(1.03)}
footer{margin-top:40px;font-style:italic;color:rgba(255,246,234,.6)}
@media (prefers-reduced-motion:reduce){.balloon,.spark,.crest,h1,.flame{animation:none}.balloon{bottom:20%}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="float" id="float" aria-hidden="true"></div>

<main>
  <svg class="crest" viewBox="0 0 100 100" aria-hidden="true">
    <g fill="none" stroke="#e8c987" stroke-width="1.2">
      <circle cx="50" cy="50" r="44"/><circle cx="50" cy="50" r="38" stroke-dasharray="2 5"/>
      <path d="M50 12 L54 46 L88 50 L54 54 L50 88 L46 54 L12 50 L46 46 Z" fill="rgba(232,201,135,.18)"/>
    </g>
  </svg>
  <p class="hb">HAPPY BIRTHDAY</p>
  <h1>Lakshmi</h1>
  <p class="sub">to our mentor, with admiration</p>
  <div class="rule" aria-hidden="true">✦</div>

  <button class="cake" id="cake" aria-label="Blow out the candles">
    <div class="tier t1"></div><div class="tier t2"></div><div class="tier t3"></div>
    <div class="candle" style="left:80px"><div class="flame"></div></div>
    <div class="candle" style="left:97px;height:32px"><div class="flame"></div></div>
    <div class="candle" style="left:114px"><div class="flame"></div></div>
  </button>
  <p class="hint" id="hint">Tap the cake to blow out the candles and make a wish</p>

  <section class="card">
    <p class="lead">Happy Birthday</p>
    <p>Thank you for always guiding us and sharing so much knowledge with us—we truly learn a lot from you. Wishing you a wonderful year ahead!</p>
    <p class="em" aria-hidden="true">🎂✨</p>
    <button class="btn" id="party">Celebrate</button>
  </section>
  <footer>With gratitude and love</footer>
</main>

<script>
(function(){
  var fl=document.getElementById('float'),cols=['#f4b6c2','#e8c987','#c9a6ff','#ff9db1','#fff0c2','#9fd8ff'];
  for(var i=0;i<14;i++){
    var b=document.createElement('div');b.className='balloon';
    b.style.left=(Math.random()*95)+'%';b.style.background='radial-gradient(circle at 35% 30%,#fff8,'+cols[i%cols.length]+' 45%)';
    b.style.backgroundColor=cols[i%cols.length];b.style.animationDuration=(16+Math.random()*16)+'s';b.style.animationDelay=(-Math.random()*24)+'s';
    b.style.transform='scale('+(.7+Math.random()*.7)+')';fl.appendChild(b);
  }
  for(var j=0;j<28;j++){
    var s=document.createElement('div');s.className='spark';
    s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=(Math.random()*3)+'s';s.style.animationDuration=(2+Math.random()*3)+'s';fl.appendChild(s);
  }
  var c=document.getElementById('fx'),x=c.getContext('2d'),W,H,P=[];
  function rs(){W=c.width=innerWidth;H=c.height=innerHeight}rs();addEventListener('resize',rs);
  var pal=['#e8c987','#f4b6c2','#fff3c9','#c9a6ff','#ff9db1','#b8893a'];
  function burst(cx,cy,n){
    for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,v=4+Math.random()*9;
      P.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-6,r:Math.random()*6.28,vr:(Math.random()-.5)*.4,w:5+Math.random()*7,h:3+Math.random()*5,col:pal[i%pal.length],l:1})}
    if(!run){run=1;requestAnimationFrame(tick)}
  }
  function rain(){for(var i=0;i<90;i++)P.push({x:Math.random()*W,y:-20-Math.random()*H*.5,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,w:6+Math.random()*6,h:3+Math.random()*4,col:pal[i%pal.length],l:1});
    if(!run){run=1;requestAnimationFrame(tick)}}
  var run=0;
  function tick(){
    x.clearRect(0,0,W,H);
    P=P.filter(function(p){return p.y<H+30&&p.l>0});
    P.forEach(function(p){p.vy+=.22;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l-=.0035;
      x.save();x.globalAlpha=Math.max(p.l,0);x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.col;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});
    if(P.length)requestAnimationFrame(tick);else run=0;
  }
  var cake=document.getElementById('cake'),hint=document.getElementById('hint');
  cake.addEventListener('click',function(){
    if(cake.classList.contains('out')){cake.classList.remove('out');hint.textContent='Tap the cake to blow out the candles and make a wish';return}
    cake.classList.add('out');hint.textContent='May every wish you made come true ✨';
    var r=cake.getBoundingClientRect();burst(r.left+r.width/2,r.top+20,140);
  });
  document.getElementById('party').addEventListener('click',function(){
    burst(innerWidth*.25,innerHeight*.6,90);burst(innerWidth*.75,innerHeight*.6,90);rain();
  });
  setTimeout(function(){burst(innerWidth/2,innerHeight*.35,120)},700);
})();
</script>
</body>
</html>
